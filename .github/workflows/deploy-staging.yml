name: Deploy (Staging)

on:
  push:
    branches: [dev]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    env:
      SSH_HOST: silk.uvm.edu
      SSH_USER: aero
      TARGET_ROOT: /users/a/e/aero/www-root-dev
      SILK_HOSTNAME: dev.aero.w3.uvm.edu
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Set up deploy key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Sync backend
        run: |
          rsync -az --delete \
            --exclude 'venv/' \
            --exclude '.env' \
            --exclude '__pycache__/' \
            --exclude '*.pyc' \
            --exclude 'data/donations.json' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            backend/ "$SSH_USER@$SSH_HOST:$TARGET_ROOT/backend/"

      - name: Sync built frontend
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            frontend/dist/ "$SSH_USER@$SSH_HOST:$TARGET_ROOT/frontend/dist/"

      - name: Install deps and reload
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            "cd $TARGET_ROOT/backend && venv/bin/pip install -q -r requirements.txt && chmod u+x wsgi.py && silk app $SILK_HOSTNAME load"

      - name: Clean up deploy key
        if: always()
        run: rm -f ~/.ssh/deploy_key
